services:
  db:
    image: postgres:15-alpine
    container_name: reppay_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: reppay
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: reppay_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts_sql:/docker-entrypoint-initdb.d:ro

  api:
    build: 
      context: ./RepPay.API
    container_name: reppay_api
    restart: always
    ports:
      - "5149:8080" 
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=reppay_db;Username=reppay;Password=admin
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  frontend:
    build: 
      context: ./react
    container_name: reppay_frontend
    restart: always
    ports:
      - "3000:80" 
    depends_on:
      - api
    
  frontend-dev:
    build:
      context: ./react
      dockerfile: Dockerfile.dev  
    container_name: reppay_frontend_dev
    volumes:
      - ./react:/app           
      - /app/node_modules      
    ports:
      - "5173:5173"           
    environment:
      - CHOKIDAR_USEPOLLING=true 

volumes:
  pgdata:

  